name: pic_to_contact
description: Scan business cards and save contacts using Claude AI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_contacts: ^1.1.9
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
